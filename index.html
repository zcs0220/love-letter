<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>❤ 我的心，想对你说</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0d0017;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  }

  /* ---------- 梦幻极光背景 ---------- */
  .nebula { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(90px); opacity: .55;
    mix-blend-mode: screen;
  }
  .b1 {
    width: 58vmax; height: 58vmax; left: -16vmax; top: -16vmax;
    background: radial-gradient(circle, rgba(255, 46, 99, .34), transparent 62%);
    animation: drift1 26s ease-in-out infinite alternate;
  }
  .b2 {
    width: 50vmax; height: 50vmax; right: -13vmax; bottom: -15vmax;
    background: radial-gradient(circle, rgba(126, 58, 255, .30), transparent 62%);
    animation: drift2 32s ease-in-out infinite alternate;
  }
  .b3 {
    width: 40vmax; height: 40vmax; left: 28%; top: 18%;
    background: radial-gradient(circle, rgba(255, 140, 180, .18), transparent 60%);
    animation: drift3 24s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(9vmax, 6vmax) scale(1.18); } }
  @keyframes drift2 { to { transform: translate(-8vmax, -5vmax) scale(1.12); } }
  @keyframes drift3 { to { transform: translate(5vmax, 8vmax) scale(1.25); } }

  #canvas { position: fixed; inset: 0; z-index: 1; display: block; }

  /* 柔和的暗角 */
  body::after {
    content: "";
    position: fixed; inset: 0; z-index: 4;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(8, 0, 16, .5) 100%);
  }

  /* 章节切换的径向闪光 */
  #flash {
    position: fixed; inset: 0; z-index: 6;
    pointer-events: none; opacity: 0;
    background: radial-gradient(circle at center,
      rgba(255, 255, 255, .55),
      rgba(255, 107, 157, .28) 42%,
      transparent 72%);
  }
  #flash.on { animation: flashAnim .55s ease-out forwards; }
  @keyframes flashAnim { 0% { opacity: .6; } 100% { opacity: 0; } }

  .overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; pointer-events: none;
    padding: 0 5vw;
  }

  /* ---------- 开场 ---------- */
  .title {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic; font-weight: normal;
    font-size: clamp(2.4rem, 7.5vw, 4.8rem);
    letter-spacing: .1em;
    background: linear-gradient(90deg, #ffd6e7, #ff7eb3, #ffd166, #ff7eb3, #ffd6e7);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 28px rgba(255, 46, 99, .5));
    animation: shine 7s linear infinite, fadeUp 1.6s .4s forwards;
  }
  @keyframes shine { to { background-position: 220% 0; } }

  .love-words {
    margin-top: 14px;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    color: #ffb3cd;
    font-size: clamp(.95rem, 2.3vw, 1.15rem);
    letter-spacing: .22em; text-indent: .22em;
    text-shadow: 0 0 16px rgba(255, 107, 157, .5);
    opacity: 1;
    transition: opacity .5s ease;
  }
  .love-words.fade-out { opacity: 0; }

  .subtitle {
    margin-top: 16px;
    color: #ffd7e6;
    font-size: clamp(1rem, 2.7vw, 1.4rem);
    letter-spacing: .42em; text-indent: .42em;
    opacity: 0;
    animation: fadeUp 1.6s 1.1s forwards;
  }
  .greet-line {
    margin-top: 10px;
    color: #ffb3cd;
    font-size: clamp(.85rem, 2vw, 1rem);
    letter-spacing: .25em;
    opacity: 0;
    animation: fadeUp 1.6s 1.45s forwards;
  }

  .btn {
    pointer-events: auto;
    margin-top: 44px;
    padding: 17px 52px;
    border: none; border-radius: 999px;
    font-size: clamp(1rem, 2.4vw, 1.2rem);
    letter-spacing: .3em; text-indent: .3em;
    color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ff2e63, #ff6b9d);
    box-shadow: 0 10px 34px rgba(255, 46, 99, .5), inset 0 0 0 1px rgba(255, 255, 255, .2);
    opacity: 0;
    animation: fadeUp 1.6s 1.8s forwards, pulseGlow 2.4s ease-in-out 3.4s infinite;
    transition: transform .2s, box-shadow .2s;
  }
  .btn:hover  { transform: translateY(-3px) scale(1.04); box-shadow: 0 16px 48px rgba(255, 46, 99, .7); }
  .btn:active { transform: scale(.97); }

  #message { display: none; }

  /* ---------- 表白卡片 ---------- */
  .msg-card {
    pointer-events: auto;
    position: relative;
    background: rgba(20, 4, 32, .55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 170, 200, .22);
    border-radius: 24px;
    padding: clamp(24px, 5vw, 46px) clamp(20px, 6vw, 58px);
    max-width: 680px;
    box-shadow:
      0 24px 80px rgba(0, 0, 0, .5),
      0 0 110px rgba(255, 46, 99, .2),
      inset 0 0 60px rgba(255, 46, 99, .06);
    transition: opacity .38s ease, transform .38s ease;
  }
  .msg-card::before, .msg-card::after {
    content: "❦";
    position: absolute;
    color: rgba(255, 107, 157, .75);
    font-size: 1.15rem;
    text-shadow: 0 0 12px rgba(255, 46, 99, .8);
  }
  .msg-card::before { top: 14px; left: 18px; }
  .msg-card::after  { bottom: 12px; right: 18px; transform: rotate(180deg); }
  .msg-card.leaving { opacity: 0; transform: translateY(12px) scale(.97); }

  .dots { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 18px; min-height: 18px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(255, 255, 255, .22);
    transition: background .4s, box-shadow .4s, transform .4s;
  }
  .dot.on {
    width: auto; height: auto; background: none; box-shadow: none; transform: none;
    font-size: 15px; line-height: 1;
    color: #ff6b9d;
    text-shadow: 0 0 12px rgba(255, 107, 157, .95);
  }

  .chapter-title {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    color: #ffd166;
    font-size: clamp(1rem, 2.6vw, 1.3rem);
    letter-spacing: .18em;
    text-shadow: 0 0 18px rgba(255, 209, 102, .5);
    margin-bottom: 18px;
  }
  .chapter-title::before, .chapter-title::after {
    content: "— ❦ —";
    color: rgba(255, 107, 157, .65);
    font-size: .8em;
    margin: 0 12px;
  }

  .msg-lines {
    font-size: clamp(1.05rem, 3vw, 1.32rem);
    line-height: 2.1;
    color: #ffeef5;
    letter-spacing: .1em;
    min-height: 10em;
    text-align: left;
  }
  .cursor {
    display: inline-block;
    width: .55em; height: 1.1em;
    background: #ff6b9d;
    vertical-align: -.18em;
    margin-left: 2px;
    animation: blink .85s steps(1) infinite;
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .question {
    margin-top: 24px;
    font-size: clamp(1.25rem, 3.6vw, 1.7rem);
    font-weight: 600;
    letter-spacing: .12em;
    background: linear-gradient(90deg, #ffd6e7, #ff7eb3, #ffd166);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 20px rgba(255, 46, 99, .45));
    opacity: 0; transition: opacity 1s ease;
  }

  .sign {
    margin-top: 20px; text-align: right;
    color: #ffb3cd;
    font-size: clamp(.9rem, 2.2vw, 1.05rem);
    letter-spacing: .25em; text-indent: .25em;
    opacity: 0; transition: opacity 1.2s ease;
  }

  .btn-row { margin-top: 8px; }
  .btn-continue {
    pointer-events: auto;
    margin-top: 26px;
    padding: 13px 38px;
    border: 1px solid rgba(255, 209, 102, .5);
    border-radius: 999px;
    font-size: 1.02rem; letter-spacing: .2em;
    color: #ffd166; cursor: pointer;
    background: rgba(255, 209, 102, .08);
    box-shadow: 0 6px 24px rgba(255, 209, 102, .22);
    opacity: 0; transition: opacity 1s ease, transform .2s, box-shadow .2s;
  }
  .btn-continue:hover { transform: translateY(-2px); box-shadow: 0 10px 34px rgba(255, 209, 102, .4); }

  .btn-yes {
    pointer-events: auto;
    margin: 28px 10px 0;
    padding: 15px 40px;
    border: none; border-radius: 999px;
    font-size: 1.08rem; letter-spacing: .22em;
    color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ff6b9d, #ff2e63);
    box-shadow: 0 8px 28px rgba(255, 46, 99, .55), inset 0 0 0 1px rgba(255, 255, 255, .2);
    opacity: 0; transition: opacity 1.2s ease, transform .15s, box-shadow .15s;
    animation: pulseGlow 1.8s ease-in-out infinite;
  }
  .btn-yes:hover { transform: scale(1.07); box-shadow: 0 12px 40px rgba(255, 46, 99, .75); }
  .btn-yes:disabled { opacity: .5; pointer-events: none; }

  .show { opacity: 1 !important; }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 8px 28px rgba(255, 46, 99, .45), inset 0 0 0 1px rgba(255, 255, 255, .2); }
    50%      { box-shadow: 0 8px 42px rgba(255, 46, 99, .85), inset 0 0 0 1px rgba(255, 255, 255, .2); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- 终章：告白 ---------- */
  #finalOverlay { display: none; pointer-events: auto; }
  .final-text {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: clamp(1.8rem, 5.5vw, 3.2rem);
    letter-spacing: .12em;
    background: linear-gradient(90deg, #ffd6e7, #ff7eb3, #ffd166, #ff7eb3, #ffd6e7);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 34px rgba(255, 46, 99, .6));
    animation: shine 6s linear infinite, fadeUp 1.4s .3s forwards;
  }
  .final-sub {
    margin-top: 22px;
    color: #ffd7e6;
    font-size: clamp(1rem, 2.6vw, 1.25rem);
    letter-spacing: .3em; text-indent: .3em;
    opacity: 0;
    animation: fadeUp 1.6s 1.2s forwards;
  }

  /* ---------- 恋爱证书 ---------- */
  #certOverlay { display: none; pointer-events: auto; }
  .cert {
    position: relative;
    background: linear-gradient(160deg, rgba(34, 14, 44, .92), rgba(18, 4, 30, .94));
    border: 1px solid rgba(255, 209, 102, .6);
    border-radius: 20px;
    padding: clamp(26px, 5vw, 46px) clamp(22px, 6vw, 56px);
    max-width: 600px;
    box-shadow:
      0 24px 90px rgba(0, 0, 0, .55),
      0 0 130px rgba(255, 209, 102, .18),
      inset 0 0 80px rgba(255, 209, 102, .05);
    opacity: 0; transform: translateY(18px) scale(.96);
    animation: certIn 1s .1s forwards;
  }
  @keyframes certIn { to { opacity: 1; transform: none; } }
  .cert-title {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    color: #ffd166;
    font-size: clamp(1.6rem, 4.6vw, 2.3rem);
    letter-spacing: .35em; text-indent: .35em;
    text-shadow: 0 0 26px rgba(255, 209, 102, .55);
    margin-bottom: 22px;
  }
  .cert-body {
    color: #ffeef5;
    font-size: clamp(1rem, 2.8vw, 1.2rem);
    line-height: 2.1;
    letter-spacing: .08em;
    text-align: left;
  }
  .cert-vow {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed rgba(255, 209, 102, .35);
    color: #ffd166;
    font-size: clamp(.95rem, 2.4vw, 1.08rem);
    line-height: 2;
    letter-spacing: .1em;
  }
  .cert-no {
    margin-top: 22px;
    color: rgba(255, 179, 205, .6);
    font-size: .85rem;
    letter-spacing: .2em;
    text-align: right;
  }
  .cert-seal {
    position: absolute; right: 22px; bottom: 24px;
    width: 92px; height: 92px; border-radius: 50%;
    border: 2px solid rgba(230, 57, 70, .85);
    color: #e63946;
    font-size: 14px; font-weight: 600;
    letter-spacing: 3px; text-indent: 3px;
    display: flex; align-items: center; justify-content: center;
    transform: rotate(-14deg);
    opacity: .9;
    box-shadow: 0 0 18px rgba(230, 57, 70, .35), inset 0 0 12px rgba(230, 57, 70, .18);
    pointer-events: none;
  }

  .cert-timer {
    margin-top: 20px;
    color: #ffd166;
    font-size: clamp(1rem, 2.8vw, 1.25rem);
    font-weight: 600;
    letter-spacing: .1em;
    text-shadow: 0 0 22px rgba(255, 209, 102, .5);
  }

  /* ---------- 集爱心小互动 ---------- */
  #gameOverlay {
    display: none;
    position: absolute; inset: 0;
    pointer-events: auto;
  }
  .game-box {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none;
  }
  .game-title {
    margin-top: clamp(18px, 6vh, 44px);
    color: #ffd7e6;
    font-size: clamp(1.05rem, 3vw, 1.4rem);
    letter-spacing: .15em; text-indent: .15em;
    text-shadow: 0 0 18px rgba(255, 107, 157, .5);
  }
  .game-hint {
    margin-top: 10px;
    color: #ffb3cd;
    font-size: clamp(.85rem, 2.2vw, 1rem);
    letter-spacing: .08em;
    opacity: .9;
    padding: 0 6vw;
  }
  .game-progress {
    margin-top: 14px;
    color: #ffd166;
    font-size: clamp(.95rem, 2.4vw, 1.15rem);
    letter-spacing: .2em; text-indent: .2em;
    min-height: 1.5em;
    text-shadow: 0 0 16px rgba(255, 209, 102, .5);
  }
  .game-field { position: absolute; inset: 0; pointer-events: none; }
  .game-core {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(72px, 18vw, 128px);
    line-height: 1;
    color: rgba(255, 107, 157, .2);
    pointer-events: none; user-select: none;
    transition: color .4s ease, text-shadow .4s ease, transform .4s ease;
  }
  .game-core.filling {
    color: rgba(255, 107, 157, .5);
    text-shadow: 0 0 36px rgba(255, 46, 99, .5);
    transform: translate(-50%, -50%) scale(1.06);
  }
  .game-core.full {
    color: #ff2e63;
    text-shadow: 0 0 64px rgba(255, 46, 99, .95);
    animation: corePulse .7s ease-in-out infinite alternate;
  }
  @keyframes corePulse {
    to { transform: translate(-50%, -50%) scale(1.32); }
  }
  .game-heart {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 54px; height: 54px;
    border: none; background: transparent;
    font-size: 30px; line-height: 1;
    color: #ff6b9d; cursor: pointer;
    pointer-events: auto;
    text-shadow: 0 0 14px rgba(255, 107, 157, .8);
    -webkit-tap-highlight-color: transparent;
    animation: heartFloat 3s ease-in-out infinite;
    transition: transform .38s ease-in, opacity .38s ease;
  }
  .game-heart:hover { transform: translate(-50%, -50%) scale(1.28); }
  .game-heart.fly {
    transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2);
    opacity: 0; pointer-events: none; animation: none;
  }
  @keyframes heartFloat {
    0%, 100% { margin-top: 0; }
    50%      { margin-top: -8px; }
  }

  /* ---------- 音效开关 ---------- */
  #soundBtn {
    position: fixed; top: 18px; right: 18px; z-index: 10;
    width: 46px; height: 46px;
    border: 1px solid rgba(255, 255, 255, .25);
    border-radius: 50%;
    background: rgba(255, 255, 255, .08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #ffd7e6; font-size: 1.15rem;
    cursor: pointer;
    transition: background .25s, transform .2s;
  }
  #soundBtn:hover { background: rgba(255, 255, 255, .16); transform: scale(1.08); }
  #soundBtn.off { color: rgba(255, 255, 255, .35); }

  .foot {
    position: fixed; bottom: 14px; left: 0; right: 0;
    z-index: 5; text-align: center;
    color: rgba(255, 179, 205, .4);
    font-size: .8rem; letter-spacing: .3em;
    pointer-events: none;
  }

  /* 首次点击提示 */
  #soundHint {
    position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%);
    z-index: 10; pointer-events: none;
    padding: 10px 22px; border-radius: 999px;
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #ffd7e6;
    font-size: .9rem; letter-spacing: .12em;
    white-space: nowrap;
    transition: opacity 1s ease;
    opacity: 1;
  }

  /* 预览模式：直接显示完成后的状态，方便截图检查 */
  body.preview .title,
  body.preview .love-words,
  body.preview .subtitle,
  body.preview .greet-line,
  body.preview .btn {
    animation: none;
    opacity: 1;
    transform: none;
  }
  body.preview #soundHint { display: none; }
</style>
</head>
<body>
<div class="nebula">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>
<canvas id="canvas"></canvas>
<div id="flash"></div>

<button id="soundBtn" title="音效开关">♪</button>

<div class="overlay">
  <div id="intro">
    <h1 class="title">I Love You</h1>
    <p class="love-words" id="loveWords"></p>
    <p class="subtitle" id="greet"></p>
    <p class="greet-line" id="greetLine"></p>
    <button class="btn" id="openBtn">打开我的心</button>
  </div>

  <div id="message">
    <div class="msg-card" id="msgCard">
      <div class="dots" id="dots"></div>
      <div class="chapter-title" id="chapterTitle"></div>
      <div class="msg-lines" id="msgLines"></div>
      <div class="question" id="question"></div>
      <div class="sign" id="sign"></div>
      <div class="btn-row" style="text-align:center;">
        <button class="btn-continue" id="continueBtn">继续，听我说 ➜</button>
        <button class="btn-yes" data-yes="1">我愿意 ❤</button>
        <button class="btn-yes" data-yes="2">我也愿意 ❤</button>
      </div>
    </div>
  </div>

  <div id="finalOverlay">
    <h2 class="final-text" id="finalText"></h2>
    <p class="final-sub" id="finalSub"></p>
  </div>

  <div id="certOverlay">
    <div class="cert">
      <div class="cert-title" id="certTitle"></div>
      <div class="cert-body" id="certBody"></div>
      <div class="cert-vow" id="certVow"></div>
      <div class="cert-timer" id="certTimer"></div>
      <div class="cert-no" id="certNo"></div>
      <div class="cert-seal" id="certSeal"></div>
    </div>
  </div>

  <div id="gameOverlay">
    <div class="game-box">
      <div class="game-title" id="gameTitle"></div>
      <div class="game-hint" id="gameHint"></div>
      <div class="game-progress" id="gameProgress"></div>
      <div class="game-field" id="gameField"></div>
      <div class="game-core" id="gameCore">❤</div>
    </div>
  </div>
</div>

<div class="foot">made with love ❤</div>
<div id="soundHint">🔊 点一下页面，音乐就会响起</div>

<script>
/* ============================================================
   ✏️✏️✏️  想改表白内容？只改下面这几行就够了  ✏️✏️✏️
   ============================================================ */
const CONFIG = {
  herName: "亲爱的你",                 // 对TA的称呼
  myName: "一直喜欢你的那个人",         // 落款名字
  buttonText: "打开我的心",            // 开场按钮文字
  greet: "攒了一些话，想说给你听",      // 开场副标语
  question: "做我女朋友，好不好？",     // 最后的问题
  yesTexts: ["我愿意 ❤", "我也愿意 ❤"], // 两个按钮（都是肯定答案哦）
  finalText: "以后的日子，就是你了。",
  finalSub: "我不会说太多漂亮话，但会一直对你好。",

  /* 可选：填上你们认识的日子（格式 YYYY-MM-DD），
     第四章会自动出现“今天是认识你的第 N 天”；留空则不显示 */
  sinceDate: "",

  /* 开场标题下轮播的多语言“我爱你” */
  loveWords: ["Je t'aime", "Te amo", "Ti amo", "Ich liebe dich", "Aishiteru", "我爱你"],

  /* 集爱心小互动（最后一章前） */
  game: {
    hearts: 12,
    title: "先别急，还有一个小小的环节",
    hint: "把散落的小爱心都点回心里，才能听到最后那句告白",
    done: "心集齐了",
  },

  chapters: [
    {
      title: "第一章 · 遇见",
      lines: [

/* ============================================================ */

/* 预览/测试加速开关（正常使用不受影响） */
const FAST = /[?&](fast|preview)/.test(location.search);
const IS_TOUCH = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, cx = 0, cy = 0, heartScale = 1;

const particles = [];
const floaters = [];
const confetti = [];
const shooting = [];
const stars = [];
const fireflies = [];
const sparkles = [];

let time = 0;
let exploding = false;
let explodeTimer = 0;
let ring = null;

/* 鼠标交互状态 */
let mouseX = null, mouseY = null;
let followX = 0, followY = 0;

const palette = ["#ff2e63", "#ff6b9d", "#ff8fab", "#ffb3cd", "#ffd166", "#ffffff", "#e63946"];
const confettiColors = ["#ff2e63", "#ff6b9d", "#ffd166", "#ff8fab", "#ffffff", "#c77dff"];

/* ---------- 心形曲线（经典数学心形） ---------- */
function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return { x: x * heartScale, y: -y * heartScale };
}

/* ---------- 心跳节拍（双搏动：扑通…扑通） ---------- */
function beatScale() {
  const p = (time % 1.15) / 1.15;
  const g = (c, w) => Math.exp(-Math.pow((p - c) / w, 2));
  return 1 + 0.13 * g(0.08, 0.05) + 0.09 * g(0.25, 0.055);
}

/* ---------- 尺寸与初始化 ---------- */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2;
  cy = H / 2;
  heartScale = Math.min(W, H) * 0.019;

  stars.length = 0;
  for (let i = 0; i < 110; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.4 + 0.3,
      p: Math.random() * Math.PI * 2,
      s: 0.4 + Math.random() * 1.2,
    });
  }

  initFireflies();
  makeParticles();
}

function makeParticles() {
  particles.length = 0;
  const count = Math.min(1700, Math.floor(W * H / 950));
  for (let i = 0; i < count; i++) {
    const t = Math.random() * Math.PI * 2;
    let r = Math.pow(Math.random(), 0.55);
    if (i % 5 === 0) r = 1 + (Math.random() * 0.04 - 0.02);
    const p = heartPoint(t);
    particles.push({
      bx: p.x * r,
      by: p.y * r + 6 * heartScale,
      x: (Math.random() - 0.5) * W * 1.5,
      y: (Math.random() - 0.5) * H * 1.5,
      vx: 0, vy: 0,
      size: 0.8 + Math.random() * 2.2,
      color: palette[(Math.random() * palette.length) | 0],
      tw: Math.random() * Math.PI * 2,
      twSpd: 0.5 + Math.random() * 1.6,
      glow: Math.random() < 0.18,
      spark: Math.random() < 0.05,
    });
  }
}

/* ---------- 萤火虫（心形周围飘动的暖色光点） ---------- */
function initFireflies() {
  fireflies.length = 0;
  for (let i = 0; i < 42; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * heartScale * 16;
    fireflies.push({
      ox: Math.cos(a) * r,
      oy: Math.sin(a) * r * 0.8,
      ph: Math.random() * Math.PI * 2,
      sp: 0.3 + Math.random() * 0.7,
      size: 0.8 + Math.random() * 1.7,
      color: Math.random() < 0.5 ? "#ffd166" : "#ffb347",
      fl: Math.random() * Math.PI * 2,
      fs: 1 + Math.random() * 2,
    });
  }
}

/* ---------- 一颗小爱心（飘浮装饰） ---------- */
function drawHeartShape(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 0.5, y + s * 0.05, x - s * 0.25, y - s * 0.45, x, y - s * 0.2);
  ctx.bezierCurveTo(x + s * 0.25, y - s * 0.45, x + s * 0.5, y + s * 0.05, x, y + s * 0.35);
  ctx.fill();
}

/* ---------- 流星 ---------- */
function spawnShooting() {
  const x = W * (0.2 + Math.random() * 0.7);
  const y = H * (0.04 + Math.random() * 0.22);
  const ang = Math.PI * (0.72 + Math.random() * 0.12);
  const sp = 340 + Math.random() * 280;
  shooting.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 0.9, max: 0.9 });
}

/* ---------- 径向闪光过场 ---------- */
function flash() {
  const el = document.getElementById("flash");
  el.classList.remove("on");
  void el.offsetWidth;
  el.classList.add("on");
}

/* ---------- 按钮点击处的小星光 ---------- */
function sparkBurst(x, y) {
  for (let i = 0; i < 16; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = 30 + Math.random() * 150;
    sparkles.push({
      x, y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp - 30,
      size: 1 + Math.random() * 1.6,
      color: palette[(Math.random() * palette.length) | 0],
      life: 0.5 + Math.random() * 0.45,
      max: 0.9,
    });
  }
}

/* ---------- 主循环 ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  time += dt;

  ctx.clearRect(0, 0, W, H);

  /* 星星 */
  ctx.fillStyle = "#ffffff";
  for (const s of stars) {
    ctx.globalAlpha = 0.2 + 0.6 * (0.5 + 0.5 * Math.sin(time * s.s + s.p));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* 流星 */
  if (shooting.length < 3 && Math.random() < dt * 0.22) spawnShooting();
  for (let i = shooting.length - 1; i >= 0; i--) {
    const s = shooting[i];
    s.life -= dt;
    if (s.life <= 0) { shooting.splice(i, 1); continue; }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    const a = s.life / s.max;
    const tx = s.x - s.vx * 0.14;
    const ty = s.y - s.vy * 0.14;
    const g = ctx.createLinearGradient(s.x, s.y, tx, ty);
    g.addColorStop(0, "rgba(255,255,255," + (0.9 * a) + ")");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255," + (0.85 * a) + ")";
    ctx.beginPath();
    ctx.arc(s.x, s.y, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  const beat = beatScale();

  /* 心形中心（随鼠标轻微跟随） */
  if (!IS_TOUCH && mouseX !== null) {
    const targetX = (mouseX - cx) * 0.045;
    const targetY = (mouseY - (cy + 6 * heartScale)) * 0.045;
    const k = Math.min(1, dt * 4.5);
    followX += (targetX - followX) * k;
    followY += (targetY - followY) * k;
    followX = Math.max(-12, Math.min(12, followX));
    followY = Math.max(-10, Math.min(10, followY));
  } else {
    followX *= Math.max(0, 1 - dt * 3);
    followY *= Math.max(0, 1 - dt * 3);
  }

  const hx = cx + followX;
  const hy = cy + 6 * heartScale + followY;

  /* 萤火虫 */
  ctx.shadowBlur = 8;
  for (const f of fireflies) {
    const fx = hx + f.ox + Math.sin(time * f.sp + f.ph) * heartScale * 3;
    const fy = hy + f.oy + Math.cos(time * f.sp * 0.8 + f.ph) * heartScale * 2.5;
    ctx.globalAlpha = 0.12 + 0.5 * (0.5 + 0.5 * Math.sin(time * f.fs + f.fl));
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.arc(fx, fy, f.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  /* 心形背后的呼吸柔光 */
  const haloR = heartScale * 17 * (1 + (beat - 1) * 1.6);
  const glow = ctx.createRadialGradient(hx, hy, 0, hx, hy, haloR);
  glow.addColorStop(0, "rgba(255,46,99,0.22)");
  glow.addColorStop(0.55, "rgba(255,46,99,0.07)");
  glow.addColorStop(1, "rgba(255,46,99,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  /* 粒子心形 */
  ctx.globalCompositeOperation = "lighter";
  for (const p of particles) {
    const tx = cx + p.bx * beat;
    const ty = cy + p.by * beat;

    if (exploding) {
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      p.vx *= 0.97;
      p.vy *= 0.97;
    } else {
      const ease = 0.055;
      p.x += (tx - p.x) * ease;
      p.y += (ty - p.y) * ease;
      p.x += Math.sin(time * p.twSpd + p.tw) * 0.35;
      p.y += Math.cos(time * p.twSpd * 0.8 + p.tw) * 0.3;
    }

    /* 鼠标轻微排斥 */
    if (!IS_TOUCH && !exploding && mouseX !== null) {
      const dx = p.x - mouseX;
      const dy = p.y - mouseY;
      const d2 = dx * dx + dy * dy;
      if (d2 < 8100) {
        const d = Math.sqrt(d2) || 1;
        const f = (1 - d / 90) * 46 * dt;
        p.x += (dx / d) * f;
        p.y += (dy / d) * f;
      }
    }

    const alpha = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(time * p.twSpd + p.tw));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;

    if (p.spark) {
      const s = p.size * 3.2;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(p.x - s, p.y); ctx.lineTo(p.x + s, p.y);
      ctx.moveTo(p.x, p.y - s); ctx.lineTo(p.x, p.y + s);
      ctx.stroke();
    } else {
      if (p.glow) {
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  /* 心形首次聚拢的柔光涟漪 */
  if (ring) {
    ring.r += heartScale * 7 * dt;
    ring.a -= dt * 0.9;
    if (ring.a <= 0) {
      ring = null;
    } else {
      ctx.strokeStyle = "rgba(255, 180, 210, " + ring.a.toFixed(3) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(hx, hy, ring.r, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  /* 爆炸后的回弹 */
  if (exploding) {
    explodeTimer += dt;
    if (explodeTimer > 1.7) {
      exploding = false;
      explodeTimer = 0;
    }
  }

  /* 飘浮的小爱心 */
  if (Math.random() < dt * 2.2) {
    floaters.push({
      x: Math.random() * W,
      y: H + 30,
      s: 8 + Math.random() * 22,
      vy: 24 + Math.random() * 42,
      sway: 12 + Math.random() * 24,
      ph: Math.random() * Math.PI * 2,
      a: 0.25 + Math.random() * 0.4,
    });
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= f.vy * dt;
    f.ph += dt * 1.6;
    ctx.globalAlpha = f.a * Math.min(1, (H - f.y) / 220);
    ctx.fillStyle = Math.random() < 0.5 ? "#ff6b9d" : "#ffb3cd";
    drawHeartShape(f.x + Math.sin(f.ph) * f.sway * 0.15, f.y, f.s);
    if (f.y < -40) floaters.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  /* 彩带 */
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.vy += c.g * dt;
    c.vx *= 0.99;
    c.rot += c.vr * dt;
    if (c.y > H + 30 || c.life-- < 0) { confetti.splice(i, 1); continue; }
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.globalAlpha = Math.max(0, Math.min(1, c.life / 120));
    ctx.fillStyle = c.color;
    if (c.heart) {
      drawHeartShape(0, 0, c.w);
    } else {
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  /* 点击小星光 */
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i];
    s.life -= dt;
    if (s.life <= 0) { sparkles.splice(i, 1); continue; }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy += 40 * dt;
    s.vx *= 0.98;
    ctx.globalAlpha = Math.min(1, s.life / s.max);
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size * (0.4 + 0.6 * (s.life / s.max)), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}

/* ---------- 彩带 ---------- */
function burstConfetti(n) {
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = 120 + Math.random() * 460;
    confetti.push({
      x: cx + (Math.random() - 0.5) * 120,
      y: cy + (Math.random() - 0.5) * 80,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp - 160,
      g: 320,
      w: 5 + Math.random() * 6,
      h: 3 + Math.random() * 4,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 12,
      color: confettiColors[(Math.random() * confettiColors.length) | 0],
      heart: Math.random() < 0.22,
      life: 160 + Math.random() * 80,
    });
  }
}

/* ---------- 爱心雨 ---------- */
function heartRain(n) {
  for (let i = 0; i < n; i++) {
    floaters.push({
      x: Math.random() * W,
      y: H + 30,
      s: 8 + Math.random() * 30,
      vy: 30 + Math.random() * 80,
      sway: 10 + Math.random() * 30,
      ph: Math.random() * Math.PI * 2,
      a: 0.4 + Math.random() * 0.4,
    });
  }
}

/* ---------- 心形爆散 ---------- */
function explodeHeart() {
  exploding = true;
  explodeTimer = 0;
  for (const p of particles) {
    const dx = p.x - cx;
    const dy = p.y - cy;
    const d = Math.hypot(dx, dy) || 1;
    const sp = 3 + Math.random() * 9;
    p.vx = (dx / d) * sp + (Math.random() - 0.5) * 4;
    p.vy = (dy / d) * sp + (Math.random() - 0.5) * 4;
  }
}

/* ---------- 音效与背景音乐 ---------- */
let audio = null;
let soundOn = true;
let musicTimer = null;
let nextNoteTime = 0;
let barIndex = 0;
let unlocked = false;

function ac() {
  if (!audio) {
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (C) audio = new C();
    } catch (e) { audio = null; }
  }
  if (audio && audio.state === "suspended") {
    try { audio.resume(); } catch (e) {}
  }
  return audio;
}

/* 第一次点击/按键时解锁音频（浏览器要求用户手势）并开启音乐 */
function unlockAudio() {
  const a = ac();
  if (a && !unlocked) {
    unlocked = true;
    startMusic();
  }
  const hint = document.getElementById("soundHint");
  if (hint) hint.style.opacity = "0";
}

function tone(f, t, dur, type, vol) {
  const a = ac();
  if (!a || !soundOn) return;
  try {
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type || "sine";
    o.frequency.value = f;
    const st = a.currentTime + t;
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, st + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, st + dur);
    o.connect(g);
    g.connect(a.destination);
    o.start(st);
    o.stop(st + dur + 0.05);
  } catch (e) {}
}

/* 温柔的和弦背景音乐（纯合成，无需音频文件） */
const MUSIC = [
  { bass: 110.0,  notes: [261.63, 329.63, 440.0, 329.63] }, // Am
  { bass: 87.31,  notes: [220.0, 261.63, 349.23, 261.63] }, // F
  { bass: 130.81, notes: [261.63, 329.63, 392.0, 329.63] }, // C
  { bass: 98.0,   notes: [246.94, 293.66, 392.0, 293.66] }, // G
];
function scheduleMusic() {
  const a = ac();
  if (!a || !soundOn) return;
  while (nextNoteTime < a.currentTime + 0.35) {
    const bar = MUSIC[barIndex % MUSIC.length];
    const delay = nextNoteTime - a.currentTime;
    tone(bar.bass, delay, 1.9, "sine", 0.09);
    bar.notes.forEach((f, i) => tone(f, delay + i * 0.5, 0.8, "triangle", 0.055));
    nextNoteTime += 2.0;
    barIndex++;
  }
}
function startMusic() {
  if (!soundOn || musicTimer) return;
  const a = ac();
  if (!a) return;
  nextNoteTime = a.currentTime + 0.05;
  musicTimer = setInterval(scheduleMusic, 350);
}
function stopMusic() {
  if (musicTimer) {
    clearInterval(musicTimer);
    musicTimer = null;
  }
}

/* ---------- 多语言“我爱你”轮播 ---------- */
const loveEl = document.getElementById("loveWords");
let loveIdx = 0;
function nextLoveWord() {
  loveEl.classList.add("fade-out");
  setTimeout(() => {
    loveIdx = (loveIdx + 1) % CONFIG.loveWords.length;
    loveEl.textContent = CONFIG.loveWords[loveIdx];
    loveEl.classList.remove("fade-out");
  }, 480);
}
setInterval(nextLoveWord, FAST ? 900 : 2500);

/* ---------- 打字机效果（多章节） ---------- */
let chapterIdx = 0;
let typing = false;

function typeLines(lines, done) {
  const box = document.getElementById("msgLines");
  box.innerHTML = "";
  let li = 0, ci = 0;
  typing = true;
  const cursor = document.createElement("span");
  cursor.className = "cursor";

  function nextLine() {
    if (li >= lines.length) {
      cursor.remove();
      typing = false;
      setTimeout(done, FAST ? 120 : 380);
      return;
    }
    const line = document.createElement("div");
    line.style.whiteSpace = "pre-wrap";
    box.appendChild(line);
    line.appendChild(cursor);
    const text = lines[li];
    const step = () => {
      if (ci < text.length) {
        line.insertBefore(document.createTextNode(text[ci]), cursor);
        ci++;
        setTimeout(step, FAST ? 8 : 88 + Math.random() * 70);
      } else {
        cursor.remove();
        li++; ci = 0;
        setTimeout(nextLine, FAST ? 120 : 360);
      }
    };
    step();
  }
  nextLine();
}

function sinceLine() {
  if (!CONFIG.sinceDate) return null;
  const start = new Date(CONFIG.sinceDate + "T00:00:00");
  if (isNaN(start.getTime())) return null;
  const days = Math.floor((Date.now() - start.getTime()) / 86400000) + 1;
  if (days < 1) return null;
  return "今天是认识你的第 " + days + " 天，我好像又喜欢你了一点。";
}

function showChapter(i) {
  chapterIdx = i;
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  CONFIG.chapters.forEach((_, j) => {
    const d = document.createElement("span");
    d.className = "dot" + (j === i ? " on" : "");
    d.textContent = j === i ? "❤" : "";
    dots.appendChild(d);
  });

  const question = document.getElementById("question");
  const sign = document.getElementById("sign");
  const cont = document.getElementById("continueBtn");
  const yesBtns = document.querySelectorAll(".btn-yes");
  question.classList.remove("show");
  sign.classList.remove("show");
  cont.classList.remove("show");
  for (const b of yesBtns) b.classList.remove("show");

  const card = document.getElementById("msgCard");
  card.classList.add("leaving");
  setTimeout(() => {
    document.getElementById("chapterTitle").textContent = CONFIG.chapters[i].title;
    const lines = CONFIG.chapters[i].lines.slice();
    if (i === 3) {
      const s = sinceLine();
      if (s) lines.push(s);
    }
    typeLines(lines, () => {
      if (i === 4) {
        startGame();
      } else if (i < CONFIG.chapters.length - 1) {
        cont.classList.add("show");
      } else {
        question.textContent = CONFIG.question;
        question.classList.add("show");
        sign.classList.add("show");
        for (const b of yesBtns) b.classList.add("show");
      }
    });
    card.classList.remove("leaving");
    flash();
  }, FAST ? 140 : 380);
}

/* ---------- 集爱心小互动 ---------- */
let gameCount = 0;
let gameDone = false;
let gameTotal = CONFIG.game.hearts;

function updateGameProgress(done) {
  const el = document.getElementById("gameProgress");
  if (done) {
    el.textContent = CONFIG.game.done + " ❤";
    return;
  }
  const left = gameTotal - gameCount;
  el.textContent = left <= 0 ? "" : (left === 1 ? "还差最后 1 颗小爱心" : "还差 " + left + " 颗小爱心");
}

function startGame() {
  gameCount = 0;
  gameDone = false;
  document.getElementById("message").style.display = "none";
  document.getElementById("gameOverlay").style.display = "block";
  document.getElementById("gameTitle").textContent = CONFIG.game.title;
  document.getElementById("gameHint").textContent = CONFIG.game.hint;
  const core = document.getElementById("gameCore");
  core.classList.remove("filling", "full");
  updateGameProgress(false);

  const field = document.getElementById("gameField");
  field.querySelectorAll(".game-heart").forEach(el => el.remove());
  const fw = field.clientWidth;
  const fh = field.clientHeight;
  const placed = [];
  for (let i = 0; i < gameTotal; i++) {
    let x = 0, y = 0, ok = false;
    for (let t = 0; t < 80 && !ok; t++) {
      x = fw * (0.08 + Math.random() * 0.84);
      y = fh * (0.16 + Math.random() * 0.68);
      if (Math.hypot(x - fw / 2, y - fh / 2) < 150) continue;
      ok = true;
      for (const p of placed) {
        if (Math.hypot(p.x - x, p.y - y) < 95) { ok = false; break; }
      }
    }
    placed.push({ x, y });
    const h = document.createElement("button");
    h.type = "button";
    h.className = "game-heart";
    h.textContent = "❤";
    h.style.left = x + "px";
    h.style.top = y + "px";
    h.style.animationDelay = (Math.random() * 2).toFixed(2) + "s";
    h.style.animationDuration = (2.6 + Math.random() * 1.6).toFixed(2) + "s";
    h.addEventListener("click", () => collectHeart(h));
    field.appendChild(h);
  }
}

function collectHeart(el) {
  if (gameDone || el.classList.contains("fly")) return;
  gameCount++;
  sPick();
  const core = document.getElementById("gameCore");
  core.classList.add("filling");
  const cr = core.getBoundingClientRect();
  const hr = el.getBoundingClientRect();
  el.style.setProperty("--dx", (cr.left + cr.width / 2 - (hr.left + hr.width / 2)).toFixed(1) + "px");
  el.style.setProperty("--dy", (cr.top + cr.height / 2 - (hr.top + hr.height / 2)).toFixed(1) + "px");
  el.classList.add("fly");
  updateGameProgress(false);
  setTimeout(() => el.remove(), 400);

  if (gameCount >= gameTotal && !gameDone) {
    gameDone = true;
    setTimeout(() => {
      core.classList.remove("filling");
      core.classList.add("full");
      flash();
      sComplete();
      updateGameProgress(true);
      setTimeout(() => {
        document.getElementById("gameOverlay").style.display = "none";
        document.getElementById("message").style.display = "block";
        showChapter(5);
      }, FAST ? 250 : 900);
    }, 420);
  }
}

/* ---------- 在一起计时器 ---------- */
let timerInt = null;
let startTime = 0;
function startTogetherTimer() {
  startTime = Date.now();
  updateTimer();
  if (timerInt) clearInterval(timerInt);
  timerInt = setInterval(updateTimer, 1000);
}
function updateTimer() {
  const el = document.getElementById("certTimer");
  if (!el) return;
  const sec = Math.max(0, Math.floor((Date.now() - startTime) / 1000));
  const days = Math.floor(sec / 86400);
  const hours = Math.floor((sec % 86400) / 3600);
  const mins = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = n => String(n).padStart(2, "0");
  el.textContent = CONFIG.certificate.timerLabel + " " + days + " 天 " +
    pad(hours) + " 时 " + pad(mins) + " 分 " + pad(s) + " 秒";
}

/* ---------- 恋爱证书 ---------- */
function buildCert() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  const dateStr = d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日 " +
    pad(d.getHours()) + ":" + pad(d.getMinutes());
  const c = CONFIG.certificate;

  document.getElementById("certTitle").textContent = c.title;
  const box = document.getElementById("certBody");
  box.innerHTML = "";
  for (const line of c.lines) {
    const div = document.createElement("div");
    div.textContent = line
      .replace("{my}", CONFIG.myName)
      .replace("{her}", CONFIG.herName)
      .replace("{date}", dateStr);
    box.appendChild(div);
  }
  document.getElementById("certVow").textContent = c.vow;
  document.getElementById("certSeal").textContent = c.seal;
  document.getElementById("certNo").textContent =
    c.noPrefix + "-" + Math.floor(1000 + Math.random() * 9000);
}

/* ---------- 交互 ---------- */
document.getElementById("greet").textContent = "TO  " + CONFIG.herName;
document.getElementById("greetLine").textContent = CONFIG.greet;
document.getElementById("openBtn").textContent = CONFIG.buttonText;
document.getElementById("sign").textContent = "—— " + CONFIG.myName;
document.getElementById("finalText").textContent = CONFIG.finalText;
document.getElementById("finalSub").textContent = CONFIG.finalSub;
loveEl.textContent = CONFIG.loveWords[0];

const yesBtns = document.querySelectorAll(".btn-yes");
yesBtns[0].textContent = CONFIG.yesTexts[0];
yesBtns[1].textContent = CONFIG.yesTexts[1];

function btnCenter(b) {
  const r = b.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

document.getElementById("openBtn").addEventListener("click", (e) => {
  document.getElementById("intro").style.display = "none";
  document.getElementById("message").style.display = "block";
  const c = btnCenter(e.currentTarget);
  sparkBurst(c.x, c.y);
  sClick();
  sBoom();
  explodeHeart();
  burstConfetti(200);
  heartRain(40);
  showChapter(0);
});

document.getElementById("continueBtn").addEventListener("click", (e) => {
  if (typing) return;
  const c = btnCenter(e.currentTarget);
  sparkBurst(c.x, c.y);
  sAdvance();
  burstConfetti(90);
  heartRain(18);
  showChapter(chapterIdx + 1);
});

for (const b of yesBtns) {
  b.addEventListener("click", (e) => {
    const c = btnCenter(e.currentTarget);
    sparkBurst(c.x, c.y);
    buildCert();
    startTogetherTimer();
    sYes();
    burstConfetti(300);
    heartRain(90);
    for (const bb of yesBtns) bb.disabled = true;
    document.getElementById("msgCard").classList.add("leaving");
    setTimeout(() => {
      document.getElementById("message").style.display = "none";
      document.getElementById("finalOverlay").style.display = "block";
    }, 420);
    setTimeout(() => {
      document.getElementById("finalOverlay").style.display = "none";
      document.getElementById("certOverlay").style.display = "block";
      sCert();
      flash();
    }, FAST ? 500 : 2400);
    let n = 0;
    const timer = setInterval(() => {
      if (n++ >= 4) { clearInterval(timer); return; }
      burstConfetti(120);
      heartRain(24);
    }, 650);
  });
}

/* ---------- 键盘支持：回车/空格 ---------- */
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (e.key !== "Enter" && e.key !== " ") return;
  const intro = document.getElementById("intro");
  const cert = document.getElementById("certOverlay");
  if (intro.style.display !== "none") {
    e.preventDefault();
    document.getElementById("openBtn").click();
  } else if (document.getElementById("gameOverlay").style.display !== "none") {
    e.preventDefault();
    const hearts = Array.from(document.querySelectorAll(".game-heart")).filter(h => !h.classList.contains("fly"));
    if (!hearts.length) return;
    let target = null, best = Infinity;
    if (mouseX !== null && mouseY !== null) {
      for (const h of hearts) {
        const r = h.getBoundingClientRect();
        const d = Math.hypot(r.left + r.width / 2 - mouseX, r.top + r.height / 2 - mouseY);
        if (d < best) { best = d; target = h; }
      }
    }
    (target || hearts[Math.floor(Math.random() * hearts.length)]).click();
  } else if (cert.style.display === "none") {
    const cont = document.getElementById("continueBtn");
    if (cont.classList.contains("show") && !typing) {
      e.preventDefault();
      cont.click();
    }
  }
});

/* ---------- 鼠标交互 ---------- */
if (!IS_TOUCH) {
  window.addEventListener("pointermove", (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });
  window.addEventListener("pointerleave", () => {
    mouseX = null;
    mouseY = null;
  });
}

window.addEventListener("resize", resize);

setTimeout(() => {

    p.y = cy + p.by;

}

requestAnimationFrame(frame);
